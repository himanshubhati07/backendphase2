services:
  db:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems}
      POSTGRES_USER: ${DB_USERNAME:-ems}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ems_password}
    ports:
      - "5432:5432"
    volumes:
      - ems_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ems}
      DB_USERNAME: ${DB_USERNAME:-ems}
      DB_PASSWORD: ${DB_PASSWORD:-ems_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-value}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    depends_on:
      db:
        condition: service_healthy

volumes:
  ems_db_data:

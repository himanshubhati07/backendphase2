services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
  postgres:
    image: postgres:15.10
    environment: {POSTGRES_USER: gym, POSTGRES_PASSWORD: gym, POSTGRES_DB: gym}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U gym -d gym"], interval: 5s, timeout: 5s, retries: 10}
  kafka:
    image: apache/kafka:3.9.0
    environment: {KAFKA_NODE_ID: 1, KAFKA_PROCESS_ROLES: broker,controller, KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER, KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT, KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1, KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093}
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 10s, retries: 10}
volumes: {postgres_data: {}}

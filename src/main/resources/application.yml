spring:
  application:
    name: employee-management-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD:ems_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-development-only-placeholder-secret-change-me-in-prod}
    expiry-minutes: 30
  api-key:
    # Comma-separated list of valid API keys for the optional DELETE-employee API key
    # layer. Empty/unset disables validation entirely (every request is accepted).
    keys: ${API_KEYS:test-key-1,test-key-2}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ems: INFO

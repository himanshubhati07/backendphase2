spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD:ems_password}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.ems: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
